name: Build README.md

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Decide if README needs rebuild
        id: diff
        run: |
          # Force build if README.md does not exist yet
          if [ ! -f README.md ]; then
            echo "README.md missing, will build it."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If there is no parent commit, just build
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No parent commit, will build README.md"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rebuild if:
          # - README-src.asciidoc changed
          # - any .asciidoc file changed
          # - the workflow itself changed (so new logic takes effect)
          if git diff --name-only HEAD^ HEAD | grep -E '^(README-src\.asciidoc|.*\.asciidoc|.*\.adoc|src/tests/scripts/apiGuruSpec.sh|\.github/workflows/build-readme\.yml)$' >/dev/null; then
            echo "AsciiDoc source or workflow changed, will rebuild README.md"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant changes, skipping README build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.diff.outputs.changed == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor & Pandoc
        if: steps.diff.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          gem install asciidoctor

      - name: Generate README.md from README-src.asciidoc
        if: steps.diff.outputs.changed == 'true'
        run: |
          HEADER="<!-- AUTO-GENERATED FILE — DO NOT EDIT.
          -- Edit README-src.asciidoc and let CI regenerate this file.
          -->

          "
          # Asciidoctor expands includes/tags → DocBook → Pandoc → GitHub-flavored Markdown
          asciidoctor -b docbook -o - README-src.asciidoc \
            | pandoc -f docbook -t gfm -o README.md

          printf "%s\n%s" "$HEADER" "$(cat README.md)" > README.md

      - name: Commit changes if any
        if: steps.diff.outputs.changed == 'true' && github.event.repository.fork == false
        run: |
          if git status --porcelain | grep -q 'README.md'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: rebuild README.md [skip ci]"
            git push
          else
            echo "no README.md changes to commit"
          fi
