name: Build README.asciidoc

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Decide if README needs rebuild
        id: diff
        run: |
          # Force build if README.asciidoc does not exist yet
          if [ ! -f README.asciidoc ]; then
            echo "README.asciidoc missing, will build it."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If this is the first commit or HEAD^ doesn't exist, just build
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "no parent commit, will build README.asciidoc"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rebuild if any AsciiDoc source changed in the last commit
          if git diff --name-only HEAD^ HEAD | grep -E '^(README-src\.asciidoc|.*\.asciidoc|.*\.adoc|src/tests/scripts/apiGuruSpec.sh)$' >/dev/null; then
            echo "AsciiDoc sources changed, will rebuild README.asciidoc"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no relevant changes, skipping README build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.diff.outputs.changed == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor
        if: steps.diff.outputs.changed == 'true'
        run: gem install asciidoctor

      - name: Generate README.asciidoc from README-src.asciidoc
        if: steps.diff.outputs.changed == 'true'
        run: |
          HEADER="// AUTO-GENERATED FILE — DO NOT EDIT.
          // Edit README-src.asciidoc and let CI regenerate this file.

          "
          CONTENT=$(asciidoctor -o - README-src.asciidoc)
          printf "%s\n%s" "$HEADER" "$CONTENT" > README.asciidoc

      - name: Commit changes if any
        if: steps.diff.outputs.changed == 'true' && github.event.repository.fork == false
        run: |
          if git status --porcelain | grep -q 'README.asciidoc'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.asciidoc
            git commit -m "chore: rebuild README.asciidoc [skip ci]"
            git push
          else
            echo "no README.asciidoc changes to commit"
          fi
